<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Grant Geist</title>
    <meta
      name="description"
      content="This page does not exist. Browse Grant Geist’s portfolio home, about, and selected work."
    />
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background-color: #0b0e14;
        color: #e5e7eb;
        font-family: Montserrat, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: 100%;
        max-width: 36rem;
      }

      .brand {
        margin: 0 0 1.5rem;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9ca3af;
      }

      .brand a {
        color: inherit;
        text-decoration: none;
      }

      .brand a:hover,
      .brand a:focus-visible {
        color: #0066cc;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f9fafb;
      }

      p {
        margin: 0 0 1.75rem;
        color: #9ca3af;
      }

      nav {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      nav a {
        color: #0066cc;
        text-decoration: none;
        font-weight: 700;
      }

      nav a:hover,
      nav a:focus-visible {
        color: #0052a3;
        text-decoration: underline;
      }

      .section-label {
        margin: 1.5rem 0 0.5rem;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand"><a href="/">Grant Geist</a></p>
      <h1>Page not found</h1>
      <p>That URL isn’t on this site. Try one of these pages instead.</p>
      <nav aria-label="Site pages">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <p class="section-label">Selected work</p>
        <a href="/projects/replacement-trap">The Replacement Trap</a>
        <a href="/projects/signal-storm">Storm Signal</a>
        <a href="/projects/walkability-index">Walkability Index</a>
        <a href="/projects/bantr">Bantr</a>
      </nav>
    </main>
  </body>
</html>
